/obsbot/obsbot_ptz:
  ros__parameters:
    # Leave empty to auto-detect the first OBSBOT with pan/tilt controls.
    device: ""
    control_rate: 50.0
    publish_rate: 20.0
    frame_id: "obsbot_camera"

    # Rate at full stick deflection, degrees per second. The camera is a true
    # velocity device: one unit is one deg/s, and it is smooth all the way
    # down to 1 deg/s, so there is no minimum rate to tune. Hardware maximum
    # is 160 pan / 120 tilt; above ~80 the picture is a blur anyway.
    max_pan_rate: 60.0
    max_tilt_rate: 45.0
    # Zoom fraction per second. 0..1 spans 1x to 4x, so 0.15 crosses the
    # whole range in about 7 s -- slow enough to aim a tap.
    max_zoom_rate: 0.15

    # Optional ramp, deg/s^2. 0.0 passes the stick straight through, which is
    # what a stick should feel like; raise it (e.g. 200) to soften slams.
    pan_accel: 0.0
    tilt_accel: 0.0

    invert_pan: false
    invert_tilt: false

    # Soft limits in degrees, enforced against the camera's measured position;
    # .nan means "use the hardware limit" (Tiny 2 Lite reports +-130 / +-90).
    pan_min: .nan
    pan_max: .nan
    tilt_min: .nan
    tilt_max: .nan

    # Stop if commands go stale, so a dead publisher cannot leave the gimbal
    # running into its end stop.
    cmd_timeout: 0.5

    # Velocity commands only work while the camera is streaming video. Who
    # keeps it streaming:
    #   auto   - this node, unless something else already captures; the GCS
    #            asks it to step aside (release_stream service) when it opens
    #   always - this node, unconditionally (nothing else will ever capture)
    #   never  - something else must (e.g. a v4l2_camera node); the node
    #            only checks, and holds still while nobody streams
    stream: "auto"
